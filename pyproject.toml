[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-dia"
version = "0.1.0"
description = "A local work assistant operated by coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asistente = "asistentedia.cli:main"

[tool.setuptools.packages.find]
include = ["asistentedia*"]
